<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات کلاس - کلاسور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- نوار ناوبری -->
    <nav class="bg-white shadow-lg p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center">
                <a href="{% url 'accounts:dashboard' %}" class="text-blue-600 hover:text-blue-800 ml-4">
                    <i class="fas fa-arrow-right text-xl"></i>
                </a>
                <h1 class="text-xl font-bold text-gray-800" id="classTitle">در حال بارگذاری...</h1>
                <span id="classBadge" class="mr-3 px-3 py-1 text-xs rounded-full bg-green-100 text-green-600">عمومی</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="logout()" class="text-red-500 hover:text-red-700">
                    <i class="fas fa-sign-out-alt text-xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- محتوای اصلی -->
    <div class="container mx-auto px-4 py-6">
        <!-- اطلاعات کلاس -->
        <div class="bg-white rounded-xl shadow p-6 mb-6" id="classInfo">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <p class="text-gray-500 text-sm">استاد</p>
                    <p class="font-semibold" id="teacherName">-</p>
                </div>
                <div>
                    <p class="text-gray-500 text-sm">تعداد اعضا</p>
                    <p class="font-semibold" id="memberCount">0</p>
                </div>
                <div>
                    <p class="text-gray-500 text-sm">نوع کلاس</p>
                    <p class="font-semibold" id="classType">-</p>
                </div>
                <div>
                    <p class="text-gray-500 text-sm">وضعیت</p>
                    <p class="font-semibold text-green-600" id="classStatus">فعال</p>
                </div>
            </div>
            <div class="mt-4 pt-4 border-t">
                <p class="text-gray-600" id="classDescription">-</p>
            </div>
            <div class="mt-4 flex gap-3 flex-wrap" id="actionButtons">
                <button onclick="leaveClass()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                    <i class="fas fa-sign-out-alt ml-2"></i>خروج از کلاس
                </button>
                <button onclick="copyInviteLink()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">
                    <i class="fas fa-link ml-2"></i>کپی لینک دعوت
                </button>
            </div>
        </div>

        <!-- تب‌ها -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="flex border-b overflow-x-auto">
                <button class="tab-btn active px-6 py-3 text-blue-600 border-b-2 border-blue-600 font-medium whitespace-nowrap" data-tab="members">
                    <i class="fas fa-users ml-2"></i>اعضا
                </button>
                <button class="tab-btn px-6 py-3 text-gray-600 hover:text-blue-600 font-medium whitespace-nowrap" data-tab="invite">
                    <i class="fas fa-envelope ml-2"></i>دعوت‌نامه
                </button>
            </div>

            <div class="p-6">
                <!-- تب اعضا -->
                <div id="tab-members" class="tab-content">
                    <div id="membersList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <p class="text-gray-400 col-span-full text-center py-8">در حال بارگذاری...</p>
                    </div>
                </div>

                <!-- تب دعوت‌نامه -->
                <div id="tab-invite" class="tab-content hidden">
                    <div class="max-w-md mx-auto">
                        <h3 class="text-lg font-bold mb-4">ارسال دعوت‌نامه</h3>
                        <form id="inviteForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">
                                    نام کاربری کاربر دعوت‌شونده
                                </label>
                                <input type="text" id="inviteUsername" required 
                                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                                       placeholder="نام کاربری را وارد کنید">
                            </div>
                            <button type="submit" 
                                    class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
                                <i class="fas fa-paper-plane ml-2"></i>
                                ارسال دعوت‌نامه
                            </button>
                        </form>
                        <div id="inviteMessage" class="mt-4 hidden p-3 rounded-lg"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            if (confirm('آیا از خروج مطمئن هستید؟')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('user');
                window.location.href = "{% url 'accounts:login' %}";
            }
        }

        // مدیریت تب‌ها
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active', 'text-blue-600', 'border-b-2', 'border-blue-600');
                    b.classList.add('text-gray-600');
                });
                this.classList.add('active', 'text-blue-600', 'border-b-2', 'border-blue-600');
                this.classList.remove('text-gray-600');
                
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.add('hidden');
                });
                document.getElementById(`tab-${this.dataset.tab}`).classList.remove('hidden');
            });
        });

        // ===== گرفتن ID از URL =====
        const classId = window.location.pathname.split('/').filter(Boolean).pop();

        // ===== بارگذاری اطلاعات کلاس =====
        async function loadClassDetail() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = "{% url 'accounts:login' %}";
                    return;
                }

                const response = await fetch(`/classes/detail/api/${classId}/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    document.getElementById('classTitle').textContent = data.title;
                    document.getElementById('teacherName').textContent = data.owner_name || 'نامشخص';
                    document.getElementById('memberCount').textContent = data.member_count || 0;
                    document.getElementById('classDescription').textContent = data.description || 'بدون توضیحات';
                    
                    const badge = document.getElementById('classBadge');
                    if (data.classtype === 'PRIVATE') {
                        badge.textContent = '🔒 خصوصی';
                        badge.className = 'mr-3 px-3 py-1 text-xs rounded-full bg-red-100 text-red-600';
                    } else {
                        badge.textContent = '🌍 عمومی';
                        badge.className = 'mr-3 px-3 py-1 text-xs rounded-full bg-green-100 text-green-600';
                    }
                    
                    document.getElementById('classType').textContent = data.classtype === 'PRIVATE' ? '🔒 خصوصی' : '🌍 عمومی';

                    loadMembers();
                } else if (response.status === 401) {
                    window.location.href = "{% url 'accounts:login' %}";
                } else {
                    alert('خطا در دریافت اطلاعات کلاس');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // ===== بارگذاری اعضا =====
        async function loadMembers() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`/classes/${classId}/members/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const members = await response.json();
                    const container = document.getElementById('membersList');
                    
                    if (members.length === 0) {
                        container.innerHTML = '<p class="text-gray-400 col-span-full text-center py-8">هنوز عضوی در این کلاس نیست</p>';
                        return;
                    }

                    container.innerHTML = members.map(m => `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                            <div class="flex items-center">
                                <img src="https://ui-avatars.com/api/?name=${m.user_name || m.user}&background=3B82F6&color=fff&size=35" 
                                     class="rounded-full w-9 h-9 ml-2">
                                <div>
                                    <p class="font-semibold text-sm">${m.user_name || m.user}</p>
                                    <p class="text-xs text-gray-500">${m.role === 'TEACHER' ? 'استاد' : m.role === 'MENTOR' ? 'منتور' : 'دانشجو'}</p>
                                </div>
                            </div>
                            ${m.role !== 'TEACHER' ? `
                                <button onclick="removeMember(${m.id})" class="text-red-500 hover:text-red-700 text-sm">
                                    <i class="fas fa-user-minus"></i>
                                </button>
                            ` : ''}
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading members:', error);
            }
        }

        // ===== خروج از کلاس =====
        window.leaveClass = async function() {
            if (!confirm('آیا از خروج از این کلاس مطمئن هستید؟')) return;
            
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`/classes/leave/${classId}/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    alert('✅ با موفقیت از کلاس خارج شدید');
                    window.location.href = "{% url 'accounts:dashboard' %}";
                } else {
                    const error = await response.json();
                    alert('❌ خطا: ' + (error.detail || 'خطا در خروج از کلاس'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ خطا در ارتباط با سرور');
            }
        };

        // ===== ارسال دعوت‌نامه =====
        document.getElementById('inviteForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('inviteUsername').value;
            const msgBox = document.getElementById('inviteMessage');
            
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`/classes/invite/${classId}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ username })
                });

                if (response.ok) {
                    msgBox.className = 'mt-4 p-3 rounded-lg bg-green-100 text-green-700';
                    msgBox.textContent = '✅ دعوت‌نامه با موفقیت ارسال شد!';
                    msgBox.classList.remove('hidden');
                    document.getElementById('inviteUsername').value = '';
                } else {
                    const error = await response.json();
                    msgBox.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-700';
                    msgBox.textContent = '❌ خطا: ' + (error.error || error.detail || 'خطا در ارسال دعوت‌نامه');
                    msgBox.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error:', error);
                msgBox.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-700';
                msgBox.textContent = '❌ خطا در ارتباط با سرور';
                msgBox.classList.remove('hidden');
            }
        });

        // ===== کپی لینک دعوت =====
        window.copyInviteLink = function() {
            const link = window.location.origin + '/classes/invite/accept/';
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ لینک دعوت کپی شد!');
            }).catch(() => {
                prompt('لینک دعوت:', link);
            });
        };

        // بارگذاری اولیه
        document.addEventListener('DOMContentLoaded', loadClassDetail);
    </script>
</body>
</html>
