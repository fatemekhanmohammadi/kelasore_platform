<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد - کلاسور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body class="bg-gray-100">
    <!-- هدر -->
    <nav class="bg-white shadow-lg p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">📚 کلاسور</h1>
            <div class="flex items-center gap-4">
                <span class="text-gray-700">خوش آمدید، <span id="userName" class="font-bold text-blue-600">کاربر</span></span>
                <a href="{% url 'accounts:profile' %}" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                    <i class="fas fa-user ml-2"></i>پروفایل
                </a>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                    <i class="fas fa-sign-out-alt ml-2"></i>خروج
                </button>
            </div>
        </div>
    </nav>

    <!-- محتوا -->
    <main class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">📚 کلاس‌های من</h2>
            <a href="{% url 'classes:create_classroom_page' %}" 
               class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition flex items-center">
                <i class="fas fa-plus ml-2"></i>کلاس جدید
            </a>
        </div>

        <!-- لیست کلاس‌ها -->
        <div id="classesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fas fa-spinner fa-spin text-3xl"></i>
                <p class="mt-2">در حال بارگذاری...</p>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            if (confirm('آیا از خروج مطمئن هستید؟')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('user');
                window.location.href = "{% url 'accounts:login' %}";
            }
        }

        // ===== گرفتن اطلاعات کاربر =====
        async function loadUserProfile() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = "{% url 'accounts:login' %}";
                    return;
                }

                const response = await fetch('/api/profile/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const user = await response.json();
                    const displayName = user.first_name && user.last_name 
                        ? user.first_name + ' ' + user.last_name 
                        : user.username;
                    document.getElementById('userName').textContent = displayName;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // ===== گرفتن لیست کلاس‌ها =====
        async function loadClasses() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/classes/list/api/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const classes = await response.json();
                    const container = document.getElementById('classesList');

                    if (classes.length === 0) {
                        container.innerHTML = `
                            <div class="col-span-full text-center py-12">
                                <i class="fas fa-school text-6xl text-gray-300"></i>
                                <p class="text-gray-500 mt-4">هنوز کلاسی ندارید</p>
                                <a href="{% url 'classes:create_classroom_page' %}" 
                                   class="inline-block mt-4 bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition">
                                    اولین کلاس خود را ایجاد کنید
                                </a>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = classes.map(cls => `
                        <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition border border-gray-100">
                            <div class="flex justify-between items-start">
                                <h3 class="text-lg font-bold text-blue-600">${cls.title}</h3>
                                <span class="text-xs px-2 py-1 rounded-full 
                                    ${cls.classtype === 'PRIVATE' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">
                                    ${cls.classtype === 'PRIVATE' ? '🔒 خصوصی' : '🌍 عمومی'}
                                </span>
                            </div>
                            <p class="text-gray-600 text-sm mt-2">${cls.description?.substring(0, 80) || 'بدون توضیحات'}...</p>
                            <div class="mt-4 flex justify-between items-center text-sm text-gray-500">
                                <span>👥 ${cls.member_count || 0} عضو</span>
                                <span>👨‍🏫 ${cls.owner_name || 'نامشخص'}</span>
                            </div>
                            <div class="mt-4">
                                <a href="/classes/detail/${cls.id}/" 
                                   class="block w-full bg-blue-500 text-white text-center py-2 rounded-lg hover:bg-blue-600 transition">
                                    ورود به کلاس →
                                </a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    console.error('Error loading classes:', response.status);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('classesList').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        <i class="fas fa-exclamation-circle text-3xl"></i>
                        <p class="mt-2">خطا در بارگذاری کلاس‌ها</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
            loadClasses();
        });
    </script>
</body>
</html>
