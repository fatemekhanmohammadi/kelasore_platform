{% extends "accounts/base_auth.html" %}
{% load static %}
{% block title %}ثبت‌نام | کالسور{% endblock %}

{% block content %}
<div class="auth-card">
  <!-- ... لوگو و عنوان ... -->
  
  <form id="register-form" method="post">
    {% csrf_token %}
    <div class="field-row">
      <div class="field">
        <label>نام</label>
        <input type="text" id="first_name" name="first_name" placeholder="سینا">
      </div>
      <div class="field">
        <label>نام خانوادگی</label>
        <input type="text" id="last_name" name="last_name" placeholder="احمدی">
      </div>
    </div>
    <div class="field">
      <label>نام کاربری</label>
      <input type="text" id="username" name="username" placeholder="sina_ahmadi">
    </div>
    <div class="field">
      <label>ایمیل</label>
      <input type="email" id="email" name="email" placeholder="example@email.com">
    </div>
    <div class="field">
      <label>گذرواژه</label>
      <input type="password" id="password" name="password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary">ثبت‌نام</button>
  </form>
  
  <div class="auth-footer">
    قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'accounts:login' %}">وارد شوید</a>
  </div>
</div>

<script src="{% static 'accounts/js/auth.js' %}"></script>
{% endblock %}
