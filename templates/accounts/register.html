<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام - کلاسور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-green-600 to-teal-600 p-6 text-center">
                <div class="text-4xl mb-2">🎓</div>
                <h2 class="text-2xl font-bold text-white">ثبت‌نام در کلاسور</h2>
                <p class="text-green-100 text-sm">به جمع دانشجویان و اساتید بپیوندید</p>
            </div>

            <div class="p-6">
                <form id="registerForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نام</label>
                            <input type="text" id="firstName" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نام خانوادگی</label>
                            <input type="text" id="lastName" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="fas fa-user text-green-500 ml-1"></i>
                            نام کاربری
                        </label>
                        <input type="text" id="username" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="fas fa-envelope text-green-500 ml-1"></i>
                            ایمیل
                        </label>
                        <input type="email" id="email" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="fas fa-lock text-green-500 ml-1"></i>
                            رمز عبور
                        </label>
                        <input type="password" id="password" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="fas fa-check-circle text-green-500 ml-1"></i>
                            تکرار رمز عبور
                        </label>
                        <input type="password" id="confirmPassword" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                    </div>

                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-green-600 to-teal-600 text-white py-3 rounded-lg hover:from-green-700 hover:to-teal-700 transition duration-300 transform hover:scale-[1.02]">
                        <i class="fas fa-user-plus ml-2"></i>
                        ثبت‌نام
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <p class="text-sm text-gray-600">
                        قبلاً ثبت‌نام کرده‌اید؟
                        <a href="{% url 'accounts:login' %}" class="text-green-600 hover:text-green-800 font-semibold">
                            وارد شوید
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { authAPI } from "{% static 'accounts/js/api.js' %}";
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('❌ رمز عبور و تکرار آن مطابقت ندارند!');
                return;
            }
            
            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
            };
            
            try {
                const response = await authAPI.register(userData);
                if (response.ok) {
                    alert('✅ ثبت‌نام با موفقیت انجام شد!');
                    window.location.href = "{% url 'accounts:login' %}";
                } else {
                    const error = await response.json();
                    alert('❌ خطا: ' + JSON.stringify(error));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ خطا در ارتباط با سرور');
            }
        });
    </script>
</body>
</html>
